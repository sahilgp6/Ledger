*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:-apple-system-body}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.4;-webkit-text-size-adjust:100%}

button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:lining-nums tabular-nums}
.serif{font-family:var(--serif)}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--safe-t) + 10px) 18px 10px;display:flex;align-items:center;gap:10px}

header.top .back{border:0;background:none;color:var(--brand);font-size:1.0625rem;padding:6px 0}
main{padding:4px 16px calc(var(--tab-h) + var(--safe-b) + 24px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}

.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}

.muted{color:var(--muted)} .small{font-size:0.8125rem} .tiny{font-size:0.75rem}

.row{display:flex;align-items:center;gap:12px}

.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}

select.chip{appearance:none;-webkit-appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.month button{border:0;background:var(--chip);border-radius:10px;width:40px;height:36px;font-size:1.125rem}
.month b{font-size:1.0625rem}

input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:max(16px,1rem);min-height:46px}

/* Safari zooms into any text box under 16px; keep every box at 16px or more */

.split>*,.f{min-width:0}
input.i[type=date],input.i[type=month],input.i[type=time]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:1.25}

.search{width:100%;border:0;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:1rem;margin:0 0 10px}
.grow-x{width:var(--w)}

.pillnote{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent);white-space:nowrap}
.tagchip{color:var(--gold-ink);font-weight:500}

.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;margin-right:8px}
.safe.tone-bad{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bad) 45%,transparent)}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}

.cols{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;max-width:34px;background:var(--line);border-radius:5px 5px 2px 2px}
.cols div.now i{background:var(--gold)}
.cols span{font-size:0.6875rem;color:var(--muted)}
.chart{margin-top:6px}.chart .chg{font-weight:600;font-size:0.9375rem}

.chips.rng{margin:10px 0 0;justify-content:space-between}.chips.rng .chip{flex:1;text-align:center;padding:6px 0}
.badge{display:inline-block;font-size:0.75rem;padding:3px 8px;border-radius:999px;background:var(--brand-2);color:var(--brand);font-weight:600}
.badge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}

.esc-lvl{display:flex;align-items:center;gap:10px;margin:14px 0 8px}
.esc-badge{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.02em}
.esc-row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:2px 18px 6px;scroll-padding:0 18px;scrollbar-width:none}
.esc-row::-webkit-scrollbar{display:none}
.esc-tile{flex:0 0 46%;min-width:150px;scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:2px}

.icb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--brand-2);color:var(--brand);transition:transform .15s var(--ease)}
.icb:active{transform:scale(.92)}
table.t a{color:var(--brand);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.chk{width:22px;height:22px;accent-color:var(--brand);flex:none}
.dup{opacity:.45}
/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(15,21,18,.36);z-index:31;opacity:0;pointer-events:none;transition:opacity .3s ease-out}

#sheet{position:fixed;left:0;right:0;bottom:0;z-index:32;background:var(--card);border-radius:20px 20px 0 0;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .48s var(--ease-ios);padding:8px 18px calc(18px + var(--safe-b))}

#sheet{overscroll-behavior:contain}#scrim{touch-action:none}
#sheet{bottom:var(--kb,0px);max-height:min(92dvh,calc(var(--vvh,100dvh) - 24px));transition:transform .48s var(--ease-ios),bottom .25s var(--ease-ios)}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:0.875rem;z-index:40;opacity:0;transition:opacity .25s ease-out,transform .35s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
code{font-size:0.8125rem;background:var(--chip);padding:1px 5px;border-radius:5px}
.chip:disabled{opacity:.5}
/* Motion: quick and quiet. Off with Reduce Motion. */
.btn,.chip,.item,.link,nav.tabs [data-tab],header.top button{transition:transform .16s var(--ease),background-color .16s ease-out,opacity .16s ease-out}
.btn:active,.chip:active,nav.tabs [data-tab]:active,header.top button:active,.card.item:active,.acard:active{transform:scale(.97)}
button.item:active,.card.item:active{transform:scale(.985)}

@media (prefers-color-scheme:dark){.tone-sage{background:#1d2c24;color:#8fd0aa}.tone-sand{background:#2c271c;color:#d8bb83}.tone-clay{background:#2f211c;color:#e6a48e}.tone-slate{background:#1e2530;color:#a9bbd3}.tone-grey{background:#232a26;color:#a6b0aa}}

.loanring{display:flex;align-items:center;gap:16px}.loanring .grow{flex:1}
.ringarc{transition:stroke-dashoffset .9s var(--ease)}
input.pp{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;margin:10px 0 2px}
input.pp::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input.pp::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:14px;background:var(--brand-bg);box-shadow:0 0 0 4px var(--card),0 2px 8px rgba(15,21,18,.25)}
input.pp::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}input.pp::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:12px;background:var(--brand-bg)}
.recap{background:var(--brand-bg);color:var(--on-brand)}.recap .big{color:var(--on-brand)}
.swapin{animation:swapin .3s var(--ease) both}
@keyframes swapin{from{opacity:0;transform:translateY(4px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
.pop{animation:pop .42s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.9);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
#done{pointer-events:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;background:color-mix(in srgb,var(--card) 96%,transparent);box-shadow:var(--shadow),0 12px 30px rgba(15,21,18,.16);border-radius:20px;padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:0.875rem}
#done .tick{stroke-dasharray:30;stroke-dashoffset:30;animation:tick .36s var(--ease) .12s forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.rngu{position:relative}.rngu .u{position:absolute;bottom:2px;left:0;height:2px;background:linear-gradient(90deg,transparent 30%,var(--gold) 30%,var(--gold) 70%,transparent 70%);transition:transform .28s var(--ease-ios);pointer-events:none}
.chips.rng .chip{background:none;color:var(--muted)}.chips.rng .chip.on{background:none;color:var(--ink);font-weight:600}
.hello{margin:0 0 16px}.hello .d{font-size:.72rem;letter-spacing:.08em;font-weight:600;color:var(--gold-ink)}.hello .g{font-family:var(--serif);font-size:1.65rem;font-weight:500;margin-top:2px}.hello .s{font-size:.85rem;color:var(--muted);margin-top:4px}
.eye{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;min-height:28px}

/* ---------- Motion and interface layer (v1.7) ---------- */
.hz{position:relative}
.hsw{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;z-index:2;cursor:pointer}
.num,.money,.big,.mid{font-variant-numeric:tabular-nums}
/* page transitions: quick for everyday navigation, a cascade only on the first open of the day */
main.tab-r{animation:tabR .24s var(--ease) both} main.tab-l{animation:tabL .24s var(--ease) both}
main.push{animation:push .3s var(--ease-ios) both} main.pop{animation:pop2 .24s var(--ease) both} main.fade{animation:fade .18s ease-out both}
@keyframes tabR{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@keyframes tabL{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes push{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pop2{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
main.flipin>*:not(:first-child){animation:fade .3s ease-out .14s both}
/* progress fills: soft, no overshoot; colour arrives as it passes limits */
.grow-x,.bar i,.safebar i,.bullet i{transform-origin:left;animation:grow .9s var(--ease) both}
.bar.bud.warn i{animation:grow .9s var(--ease) both,tintW 1.1s ease-out both} .bar.bud.bad i{animation:grow .9s var(--ease) both,tintB 1.2s ease-out both}
.safe.tone-warn .safebar i{animation:grow .9s var(--ease) both,tintW 1.1s ease-out both} .safe.tone-bad .safebar i{animation:grow .9s var(--ease) both,tintB 1.2s ease-out both}
@keyframes tintW{0%,30%{background:var(--in)}100%{}} @keyframes tintB{0%,25%{background:var(--in)}60%{background:var(--warn)}100%{}}
.ringarc{transition:stroke-dashoffset 1.1s var(--ease)}
/* goal bullet */
.meter-arc{animation:meterIn 1s var(--ease) both}
@keyframes meterIn{from{stroke-dashoffset:var(--c)}}
.meter-p{font-family:Fraunces,serif;font-size:20px;fill:var(--ink)}.meter-l{font-size:9.5px;fill:var(--muted)}
.cp-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cp-tiles>div{background:var(--chip);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;transition:transform .12s}.cp-tiles>div:active{transform:scale(.97)}
.cp-tiles span{font-size:.7rem;color:var(--muted)} .cp-tiles b{font-family:Fraunces,serif;font-size:1.2rem;font-weight:500}
.cp-tiles .warn{background:color-mix(in oklch,var(--warn) 16%,var(--card))} .cp-tiles .warn span,.cp-tiles .warn b{color:color-mix(in oklch,var(--warn) 70%,var(--ink))}
.cp-result{display:flex;align-items:center;gap:12px;background:var(--brand-bg);color:var(--on-brand);border-radius:18px;padding:14px 16px}
.cp-result>div{flex:1;display:flex;flex-direction:column;gap:2px} .cp-result span{font-size:.7rem;font-weight:600;letter-spacing:.12em;opacity:.85} .cp-result small{font-size:.72rem;opacity:.8}
.cp-result b{font-family:Fraunces,serif;font-size:1.7rem;font-weight:500}
.bullet{position:relative;height:14px;border-radius:7px;background:var(--chip);margin-top:12px;overflow:visible}
.bullet .band{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:color-mix(in oklch,var(--brand) 14%,var(--chip))}
.bullet i{position:absolute;left:0;top:3px;bottom:3px;width:var(--w);border-radius:4px}
.bullet i.ok{background:var(--in)} .bullet i.warn{background:var(--warn)}
.bullet b{position:absolute;top:-4px;bottom:-4px;width:2.5px;border-radius:2px;background:var(--ink);transform:translateX(-1px)}
/* tab icons: a small lift and fill when chosen */
nav.tabs [data-tab] svg path,nav.tabs [data-tab] svg rect,nav.tabs [data-tab] svg circle{transition:fill-opacity .25s ease-out;fill-opacity:0}
nav.tabs [data-tab].on svg path,nav.tabs [data-tab].on svg rect{fill:currentColor;fill-opacity:.16}
nav.tabs [data-tab].on svg circle{fill:currentColor;fill-opacity:1}
nav.tabs [data-tab].on svg{animation:tabpop .34s var(--ease) both}
@keyframes tabpop{0%{transform:scale(.86) translateY(1px)}60%{transform:scale(1.06) translateY(-1px)}100%{transform:none}}
/* person switch: the active name is drawn in ink, clipped to the sliding pill */
.whoseg .ink{position:absolute;inset:3px;display:grid;pointer-events:none;z-index:1;transition:clip-path .38s var(--ease-ios)}
.whoseg .ink span{display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:600;color:var(--ink)}
.whoseg [data-who].on{color:transparent}
/* chart scrub label */
.cwrap{position:relative}
.ctip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--card);border-radius:10px;padding:5px 9px;font-size:.72rem;line-height:1.2;white-space:nowrap;pointer-events:none;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.ctip[hidden]{display:none}
#lp .lp-i .grow{flex:1}
.dtx{margin:12px 0 0;border-radius:12px;background:var(--chip);overflow:hidden}.dtx .item{padding:10px 14px;border-top:1px solid var(--line)}.dtx .item:first-child{border-top:0}
.ctip b{font-family:Fraunces,serif;font-size:.9rem;font-variant-numeric:tabular-nums}
/* donut */
.dn .dseg{cursor:pointer;transition:transform .3s var(--ease),opacity .25s ease-out}
.dn.drawn .dseg{animation:dgrow .9s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
@keyframes dgrow{from{stroke-dasharray:0 400}}
.donut.picked .dseg{opacity:.32} .donut.picked .dseg.on{opacity:1;transform:translate(var(--dx),var(--dy))}
.dn-l{font-size:11px;fill:var(--muted)} .dn-v{font-size:17px;font-family:Fraunces,serif;fill:var(--ink)}
.dn text.swapin{animation:swapin .28s var(--ease) both}
.drow{display:flex;align-items:center;gap:0;padding:6px 4px;border-radius:8px;cursor:pointer;transition:background-color .15s}
.drow.on{background:var(--chip)} .donut.picked .drow:not(.on){opacity:.55}
/* long-press menu */
#lp{position:fixed;inset:0;z-index:50}
#lp .lp-bg{position:absolute;inset:0;background:rgba(15,21,18,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fade .18s ease-out both}
#lp .lp-row{position:fixed;border-radius:14px;overflow:hidden;background:var(--card);box-shadow:0 18px 40px rgba(0,0,0,.22);animation:lift .22s var(--ease) both}
#lp .lp-row .item{pointer-events:none}
@keyframes lift{to{transform:scale(1.025)}}
#lp .lp-menu{position:fixed;min-width:230px;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.22);animation:menuin .2s var(--ease) both}
@keyframes menuin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#lp .lp-i{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer;font-size:1rem}
#lp .lp-i:first-child{border-top:0} #lp .lp-i:active{background:var(--chip)} #lp .lp-i.bad{color:var(--bad)}
#lp.out{animation:fade .18s ease-in reverse both}
/* calendar */
.cal-h,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{margin:10px 0 4px} .cal-h span{text-align:center;font-size:.68rem;color:var(--muted)}
.cal-d{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .15s var(--ease)}
.cal-d:active{transform:scale(.92)} .cal-d.today{box-shadow:inset 0 0 0 2px var(--gold)} .cal-d.future{opacity:.35}
.cal-k{width:12px;height:12px;border-radius:3px;display:inline-block}
/* waterfall in the recap */
.wfall{display:block;margin-top:12px;overflow:visible} .wf{transform-box:fill-box;transform-origin:bottom;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i) * 60ms)}
.wf-t{font-size:8.5px;fill:currentColor;opacity:.8}
@keyframes rise{from{transform:scaleY(0)}}
/* celebration */
#confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
#cele{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);z-index:61;pointer-events:none}
#cele .cele-card{background:var(--card);border-radius:20px;padding:18px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2);animation:celein .5s cubic-bezier(.34,1.4,.64,1) both;min-width:240px}
#cele.out .cele-card{animation:fade .4s ease-in reverse both}
@keyframes celein{from{opacity:0;transform:scale(.88) translateY(8px)}to{opacity:1;transform:none}}
/* loading shimmer */
.skel{border-radius:12px;background:linear-gradient(90deg,var(--chip) 0%,color-mix(in srgb,var(--chip) 40%,var(--card)) 45%,var(--chip) 90%);background-size:220% 100%;animation:shimmer 1.4s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
/* icon swaps: eye, copy -> check */
.eyeic{position:relative;display:inline-block;width:14px;height:14px;vertical-align:-1px}
.eyeic svg{position:absolute;inset:0;transition:opacity .25s ease-out,transform .25s var(--ease),filter .25s ease-out}
.eyeic .e-shut{opacity:0;transform:scale(.7);filter:blur(3px)}
.eye[aria-pressed=true] .e-open{opacity:0;transform:scale(.7);filter:blur(3px)} .eye[aria-pressed=true] .e-shut{opacity:1;transform:none;filter:none}
.money,.big,.mid,.item .a,.num{transition:filter .35s var(--ease)}
.iswap{display:inline-block;animation:swapin .26s var(--ease) both}
.btn.copied{background:var(--in);color:#fff}
/* softer cards in light mode: layered shadow, a little more lift when pressed */
@media (prefers-color-scheme: light){.card,.list,.acard{box-shadow:0 0 0 1px rgba(29,42,36,.05),0 1px 2px rgba(29,42,36,.05),0 4px 14px -4px rgba(29,42,36,.08)}}
@media (prefers-reduced-motion: reduce){main.tab-r,main.tab-l,main.push,main.pop,main.fade,.wf,.dn .dseg,#lp *,#cele *,.skel,nav.tabs [data-tab].on svg{animation:none!important}.whoseg .ink{transition:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.draw{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app" class="hidden">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <div role="button" tabindex="0" class="hz" data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</div>
    <div role="button" tabindex="0" class="hz" data-act="tab" data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity</div>
    <div role="button" tabindex="0" class="hz" data-act="tab" data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Accounts</div>
    <div role="button" tabindex="0" class="hz" data-act="tab" data-tab="vault"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4" stroke-linecap="round"/></svg>Vault</div>
    <div role="button" tabindex="0" class="hz" data-act="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</div>
  </nav>
</div>
<div id="lock"></div>
<div id="scrim" data-act="closeSheet"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" class="hidden" accept="application/pdf,.pdf,text/csv,.csv,text/plain,.txt">

<script type="module" src="js/app.js"></script>
