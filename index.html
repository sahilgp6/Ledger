<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#0f1512" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f6f3ec; --card:#fbf9f4; --ink:#1d2a24; --muted:#5e6b64; --line:#e7e0d2; --brand:#1f5c45; --brand-2:#e3ebe4; --brand-bg:#1f5c45; --on-brand:#f6f3ec;
  --gold:#a8823a; --gold-ink:#6e5f3d; --out:#1d2a24; --in:#1f6b4c; --warn:#9a5a12; --bad:#a93a25; --chip:#ede7db;
  --shadow:0 0 0 1px rgba(29,42,36,.06),0 1px 2px rgba(29,42,36,.04),0 2px 6px rgba(29,42,36,.03);
  --r:18px; --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --ease:cubic-bezier(.22,1,.36,1); --ease-ios:cubic-bezier(.32,.72,0,1);
  --tab-h:58px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1512; --card:#18201c; --ink:#ece7db; --muted:#9da8a2; --line:#26302b; --brand:#7fd4a4; --brand-2:#1b2a22; --brand-bg:#2b6b52; --on-brand:#f3efe5;
  --gold:#d2b377; --gold-ink:#d2b377; --out:#ece7db; --in:#7fd4a4; --warn:#f0b060; --bad:#ff8a75; --chip:#222b26;
  --shadow:0 0 0 1px #26302b;
}}
@font-face{font-family:"Inter";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-wght-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Inter";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/inter-latin-ext-wght-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Fraunces";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-opsz-normal.woff2) format("woff2-variations");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Fraunces";font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/fraunces-latin-ext-opsz-normal.woff2) format("woff2-variations");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font:-apple-system-body}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.4;-webkit-text-size-adjust:100%}
@supports not (font:-apple-system-body){html{font-size:1rem}}
body{min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:lining-nums tabular-nums}
.serif{font-family:var(--serif)}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(var(--safe-t) + 10px) 18px 10px;display:flex;align-items:center;gap:10px}
header.top h1{font-family:var(--serif);font-weight:500;font-size:1.85rem;margin:0;flex:1;letter-spacing:-.01em}
header.top .back{border:0;background:none;color:var(--brand);font-size:1.0625rem;padding:6px 0}
main{padding:4px 16px calc(var(--tab-h) + var(--safe-b) + 24px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{border:0;background:none;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:0.6875rem;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--brand)}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h2{font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--gold-ink);margin:0 0 10px;font-weight:600}
.big{font-family:var(--serif);font-size:2.6rem;font-weight:500;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.mid{font-family:var(--serif);font-size:1.4rem;font-weight:500;font-variant-numeric:lining-nums tabular-nums}
.muted{color:var(--muted)} .small{font-size:0.8125rem} .tiny{font-size:0.75rem}
.in{color:var(--in)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px}
.row .grow,.item .grow{flex:1;min-width:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin:0 0 14px;box-shadow:var(--shadow)}
.item{display:flex;align-items:center;gap:12px;min-width:0;max-width:100%;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item .t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:0.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .a{font-family:var(--serif);font-weight:500;font-size:1.02rem;white-space:nowrap;font-variant-numeric:lining-nums tabular-nums}
.ico{width:38px;height:38px;border-radius:12px;background:var(--brand-2);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:0.875rem;flex:none}
.day{font-size:0.8125rem;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;background:var(--brand-bg);color:var(--on-brand);font-weight:600;min-height:48px}
.btn.wide{width:100%}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.danger{background:none;color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.btn:disabled{opacity:.5}
.link{border:0;background:none;color:var(--brand);padding:6px 0;font-weight:550}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:7px 12px;background:var(--chip);font-size:0.875rem;white-space:nowrap}
.chip.on{background:var(--brand-bg);color:var(--on-brand)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 9px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.month{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.month button{border:0;background:var(--chip);border-radius:10px;width:40px;height:36px;font-size:1.125rem}
.month b{font-size:1.0625rem}
label.f{display:block;margin:0 0 12px}
label.f span{display:block;font-size:0.8125rem;color:var(--muted);margin:0 0 5px}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;font-size:1rem;min-height:46px}
textarea.i{min-height:70px}
.search{width:100%;border:0;background:var(--chip);border-radius:12px;padding:10px 12px;font-size:1rem;margin:0 0 10px}
.bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--gold);border-radius:4px;transform-origin:left;animation:grow .7s var(--ease) both}
.cols{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:8px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.cols i{display:block;width:100%;max-width:34px;background:var(--line);border-radius:5px 5px 2px 2px}
.cols div.now i{background:var(--gold)}
.cols span{font-size:0.6875rem;color:var(--muted)}
.chart{margin-top:6px}.chart .chg{font-weight:600;font-size:0.9375rem}
.cwrap{position:relative;height:120px;margin-top:8px;touch-action:pan-y}.cwrap svg{display:block;width:100%;height:120px}
.cwrap .cur{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--muted);pointer-events:none}
.chips.rng{margin:10px 0 0;justify-content:space-between}.chips.rng .chip{flex:1;text-align:center;padding:6px 0}
.badge{display:inline-block;font-size:0.75rem;padding:3px 8px;border-radius:999px;background:var(--brand-2);color:var(--brand);font-weight:600}
.badge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.badge.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:0.875rem}
table.t td,table.t th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
table.t th{font-size:0.75rem;color:var(--muted);font-weight:600}
table.t td.r,table.t th.r{text-align:right}
.chk{width:22px;height:22px;accent-color:var(--brand);flex:none}
.dup{opacity:.45}
/* Sheet */
#scrim{position:fixed;inset:0;background:rgba(15,21,18,.36);z-index:31;opacity:0;pointer-events:none;transition:opacity .3s ease-out}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:32;background:var(--card);border-radius:20px 20px 0 0;max-height:92dvh;overflow-y:auto;transform:translateY(105%);transition:transform .48s var(--ease-ios);padding:8px 18px calc(18px + var(--safe-b))}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
#sheet h3{margin:0 0 14px;font-family:var(--serif);font-weight:500;font-size:1.45rem}
/* Lock */
#lock{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;overflow-y:auto;padding:calc(var(--safe-t) + 40px) 22px 30px}
#lock.on{display:block}
#lock .logo{width:72px;height:72px;border-radius:18px;margin:0 auto 14px;display:block}
#lock h1{text-align:center;margin:0 0 6px;font-family:var(--serif);font-weight:500;font-size:2rem}
#lock p.lead{text-align:center;color:var(--muted);margin:0 auto 26px;max-width:340px}
#lock .box{max-width:420px;margin:0 auto}
#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:0.875rem;z-index:40;opacity:0;transition:opacity .25s ease-out,transform .35s var(--ease);pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.hidden{display:none!important}
code{font-size:0.8125rem;background:var(--chip);padding:1px 5px;border-radius:5px}
.chip:disabled{opacity:.5}
/* Motion: quick and quiet. Off with Reduce Motion. */
.btn,.chip,.item,.link,nav.tabs button,header.top button{transition:transform .16s var(--ease),background-color .16s ease-out,opacity .16s ease-out}
.btn:active,.chip:active,nav.tabs button:active,header.top button:active{transform:scale(.97)}
button.item:active,.card.item:active{transform:scale(.985)}
main.anim>*{animation:enter .52s var(--ease) both}
main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(4){animation-delay:.15s}main.anim>*:nth-child(5){animation-delay:.2s}main.anim>*:nth-child(6){animation-delay:.25s}main.anim>*:nth-child(n+7){animation-delay:.3s}
@keyframes enter{from{opacity:0;transform:translateY(8px);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:none}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s var(--ease) .1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.masked .money,.masked .big,.masked .mid,.masked .item .a,.masked .num{filter:blur(9px)}
.money,.big,.mid,.item .a,.num{transition:filter .22s var(--ease)}
.qa-amt{font-family:var(--serif);font-size:2.8rem;text-align:center;margin:4px 0 10px;letter-spacing:-.02em}.qa-amt .cur{color:var(--muted);font-size:1.6rem;margin-right:4px;vertical-align:.5rem}
.qa-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.qa-k{min-height:52px;border:0;border-radius:14px;background:var(--chip);font-size:1.35rem;font-weight:500;transition:transform .12s var(--ease),background-color .12s}
.qa-k:active{transform:scale(.95);background:var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;font-weight:500;color:var(--muted);transition:background-color .2s var(--ease),color .2s}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(15,21,18,.12)}
.rc-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}.rc-chip{border:0;background:var(--chip);border-radius:10px;padding:8px 10px;font-size:.82rem;min-height:36px}
.swapin{animation:swapin .3s var(--ease) both}
@keyframes swapin{from{opacity:0;transform:translateY(4px);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
.pop{animation:pop .42s var(--ease) both}
@keyframes pop{from{opacity:0;transform:scale(.9);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
#done{pointer-events:none;position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:45;background:color-mix(in srgb,var(--card) 96%,transparent);box-shadow:var(--shadow),0 12px 30px rgba(15,21,18,.16);border-radius:20px;padding:20px 26px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:600;font-size:0.875rem}
#done .tick{stroke-dasharray:30;stroke-dashoffset:30;animation:tick .36s var(--ease) .12s forwards}
@keyframes tick{to{stroke-dashoffset:0}}
.rngu{position:relative}.rngu .u{position:absolute;bottom:2px;left:0;height:2px;background:linear-gradient(90deg,transparent 30%,var(--gold) 30%,var(--gold) 70%,transparent 70%);transition:transform .28s var(--ease-ios);pointer-events:none}
.chips.rng .chip{background:none;color:var(--muted)}.chips.rng .chip.on{background:none;color:var(--ink);font-weight:600}
.hello{margin:0 0 16px}.hello .d{font-size:.72rem;letter-spacing:.08em;font-weight:600;color:var(--gold-ink)}.hello .g{font-family:var(--serif);font-size:1.65rem;font-weight:500;margin-top:2px}.hello .s{font-size:.85rem;color:var(--muted);margin-top:4px}
.eye{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:6px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;min-height:28px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}.draw{stroke-dashoffset:0}}
</style>
</head>
<body>
<div id="app" class="hidden">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-act="tab" data-tab="tx"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Activity</button>
    <button data-act="tab" data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Accounts</button>
    <button data-act="tab" data-tab="import"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Import</button>
    <button data-act="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </nav>
</div>
<div id="lock"></div>
<div id="scrim" data-act="closeSheet"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" class="hidden" accept="application/pdf,.pdf,text/csv,.csv,text/plain,.txt">
<input type="file" id="restoreFile" class="hidden" accept=".json,application/json">
<script type="module" src="js/app.js"></script>
</body>
</html>
